<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FTLite</title>
  <!-- Include Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Include jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body class="flex items-center justify-center min-h-screen">
  <div class="max-w-md w-full bg-white p-8 rounded">
    <div class="text-center mb-6">
      <img src="./logo-transparent.png" alt="FTLite logo transparent" class="mx-auto">
    </div>
    <div class="mb-4" id="dropZone">
      <div class="border-2 border-gray-300 border-dashed rounded-lg p-6 cursor-pointer">
        <div class="text-center">
          <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10 4a1 1 0 00-1 1v2a1 1 0 002 0V5a1 1 0 00-1-1zM15 4a1 1 0 00-1 1v2a1 1 0 002 0V5a1 1 0 00-1-1z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 20H3a2 2 0 01-2-2V6a2 2 0 012-2h18a2 2 0 012 2v12a2 2 0 01-2 2z" />
          </svg>
          <div class="mt-1 text-sm text-gray-600">
            <p>Drag and drop your file here or</p>
            <p class="text-blue-500 cursor-pointer" id="browseButton">Browse</p>
          </div>
        </div>
        <input type="file" id="fileInput" class="hidden">
      </div>
    </div>
    <div class="flex justify-center">
      <button id="uploadButton" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
        Upload
      </button>
    </div>
  </div>

  <!-- jQuery code for handling file upload -->
  <script>
    $(document).ready(function () {
      var dropZone = document.getElementById('dropZone');
      var fileInput = document.getElementById('fileInput');
      var browseButton = document.getElementById('browseButton');

      dropZone.addEventListener('dragover', handleDragOver, false);
      dropZone.addEventListener('dragleave', handleDragLeave, false);
      dropZone.addEventListener('drop', handleFileSelect, false);
      fileInput.addEventListener('change', handleFileSelect, false);
      browseButton.addEventListener('click', function () {
        fileInput.click();
      });

      function handleDragOver(event) {
        event.stopPropagation();
        event.preventDefault();
        dropZone.classList.add('bg-gray-300');
      }

      function handleDragLeave(event) {
        event.stopPropagation();
        event.preventDefault();
        dropZone.classList.remove('bg-gray-300');
      }

      function handleFileSelect(event) {
        event.stopPropagation();
        event.preventDefault();
        dropZone.classList.remove('bg-gray-300');

        var file;
        if (event.type === 'drop') {
          file = event.dataTransfer.files[0];
        } else if (event.type === 'change') {
          file = event.target.files[0];
        }

        if (file) {
          console.log('Selected file:', file.name);
          // You can perform further actions with the selected file here
        }
      }
      
      
      $('#uploadButton').click(function () {
        var file = document.getElementById('fileInput').files[0];
        if (file) {
          var formData = new FormData();
          formData.append('file', file);

          // Show loading indicator
          var loadingLine = $('<div class="bg-blue-500 h-1"></div>');
          $('.max-w-md').append(loadingLine);

          $.ajax({
            url: 'upload.php', // Replace with the URL to your PHP file for handling the upload
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            xhr: function () {
              var xhr = new window.XMLHttpRequest();

              // Add progress event listener
              xhr.upload.addEventListener('progress', function (event) {
                if (event.lengthComputable) {
                  var percent = (event.loaded / event.total) * 100;
                  // Update loading indicator width
                  loadingLine.css('width', percent + '%');
                }
              }, false);

              return xhr;
            },
            success: function (response) {
              // Remove loading indicator
              loadingLine.remove();

              // Handle the success response from the server
              console.log('Upload successful:', response);
            },
            error: function (xhr, status, error) {
              // Remove loading indicator
              loadingLine.remove();

              // Handle the error response from the server
              console.log('Upload failed:', error);
            }
          });
        }
      });


    });
  </script>
</body>

</html>
